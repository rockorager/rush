name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The tag, both version declarations, and the checked-in notes must
      # agree before anything is built or published.
      - name: Check version and release notes
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          build_version=$(sed -n 's/^const release_version: std.SemanticVersion = .{ .major = \([0-9]*\), .minor = \([0-9]*\), .patch = \([0-9]*\) };$/\1.\2.\3/p' build.zig)
          zon_version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$build_version" != "$version" ] || [ "$zon_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.zig ($build_version) and build.zig.zon ($zon_version)"
            exit 1
          fi
          if [ ! -s "docs/releases/$version.md" ]; then
            echo "::error::missing release notes docs/releases/$version.md"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}-linux
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, aarch64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Full history and tags let the build derive its version from the tag.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          cache-key: release-${{ matrix.arch }}

      # Zig 0.16.0 cannot fetch ZIP dependencies when a fresh cache lacks tmp/.
      - name: Prepare Zig package cache
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      # A static musl build with the bundled SQLite runs on any Linux. The data
      # and configuration paths are compiled in for a /usr install, which is
      # where packages place the tarball's bin/ and share/.
      - name: Build
        run: |
          name="rush-$VERSION-$ARCH-linux"
          zig build install \
            -Dtarget="$ARCH-linux-musl" \
            -Doptimize=ReleaseSafe \
            -Dregister-shell=false \
            -Ddatadir=/usr/share \
            -Dsysconfdir=/etc \
            --prefix "stage/$name"
          # The embedding library, headers, and pkg-config files are not part
          # of the shell package, and the .pc files name the staging prefix.
          rm -rf "stage/$name/lib" "stage/$name/include" "stage/$name/share/pkgconfig"
          cp LICENSE README.md "stage/$name/"
          file "stage/$name/bin/rush" | grep -q 'statically linked'
          echo "NAME=$name" >>"$GITHUB_ENV"

      - name: Check version
        if: matrix.arch == 'x86_64'
        run: test "$("stage/$NAME/bin/rush" --version)" = "rush $VERSION"

      - name: Package
        run: |
          mtime=$(git log -1 --format=%ct)
          tar -C stage --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -cJf "$NAME.tar.xz" "$NAME"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.xz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: sha256sum -- *.tar.xz >SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Rush $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            dist/*.tar.xz dist/SHA256SUMS
