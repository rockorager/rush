name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is the version. build.zig.zon must record it too, for builds
      # from the release's source archive, which has no Git metadata.
      - name: Check version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          zon_version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$zon_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.zig.zon ($zon_version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  # Zig cross-compiles every target from Linux, so all tarballs are packaged
  # the same way.
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.os }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, aarch64]
        os: [linux, macos]
        include:
          # A static musl build with the bundled SQLite runs on any Linux. Its
          # data and configuration paths are compiled in for a /usr install,
          # which is where packages place the tarball's bin/ and share/.
          - os: linux
            abi: -musl
            datadir: /usr/share
            sysconfdir: /etc
            linkage: statically linked
          # macOS has no static libc, so the binary links only libSystem. /usr
          # is read-only there, so it is built for /usr/local instead.
          - os: macos
            datadir: /usr/local/share
            sysconfdir: /usr/local/etc
            linkage: Mach-O
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}
    steps:
      # Full history and tags let the build derive its version from the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
          cache-key: release-${{ matrix.arch }}-${{ matrix.os }}

      # Zig 0.17.1 cannot fetch ZIP dependencies when a fresh cache lacks tmp/.
      - name: Prepare Zig package cache
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Build
        run: |
          name="rush-$VERSION-$ARCH-$OS"
          zig build install \
            -Dtarget="$ARCH-$OS${{ matrix.abi }}" \
            -Doptimize=ReleaseSafe \
            -Dregister-shell=false \
            -Ddatadir=${{ matrix.datadir }} \
            -Dsysconfdir=${{ matrix.sysconfdir }} \
            --prefix "stage/$name"
          # The embedding library, headers, and pkg-config files are not part
          # of the shell package, and the .pc files name the staging prefix.
          rm -rf "stage/$name/lib" "stage/$name/include" "stage/$name/share/pkgconfig"
          cp LICENSE README.md "stage/$name/"
          file "stage/$name/bin/rush" | grep -q '${{ matrix.linkage }}'
          echo "NAME=$name" >>"$GITHUB_ENV"

      - name: Check version
        if: matrix.arch == 'x86_64' && matrix.os == 'linux'
        run: test "$("stage/$NAME/bin/rush" --version)" = "rush $VERSION"

      - name: Package
        run: |
          mtime=$(git log -1 --format=%ct)
          tar -C stage --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -cJf "$NAME.tar.xz" "$NAME"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.xz
          if-no-files-found: error

  # The macOS binaries are cross-compiled, so run one on a Mac before release.
  check-macos:
    name: Check aarch64-macos
    needs: [prepare, build]
    runs-on: macos-latest
    env:
      NAME: rush-${{ needs.prepare.outputs.version }}-aarch64-macos
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.NAME }}

      # Apple Silicon runs only signed code; Zig's linker signs ad hoc. Every
      # library outside /usr/lib would be one the user's Mac may not have.
      - name: Check binary
        run: |
          tar -xJf "$NAME.tar.xz"
          rush="$NAME/bin/rush"
          codesign --verify "$rush"
          test "$("$rush" --version)" = "rush $VERSION"
          otool -L "$rush"
          if otool -L "$rush" | tail -n +2 | grep -v '^[[:space:]]*/usr/lib/'; then
            echo "::error::$rush links libraries outside /usr/lib"
            exit 1
          fi

  publish:
    name: Publish release
    needs: [prepare, build, check-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Tags find the previous release for the notes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: sha256sum -- *.tar.xz >SHA256SUMS

      # Checked-in notes describe a release when it has them; otherwise the
      # notes list the commits since the previous release.
      - name: Write release notes
        run: |
          notes="docs/releases/$VERSION.md"
          if [ -s "$notes" ]; then
            cp "$notes" notes.md
          elif previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            git log --no-merges --format='- %s' --invert-grep -E --grep='^release: [0-9]+\.[0-9]+\.[0-9]+$' \
              "$previous..$GITHUB_REF_NAME" >notes.md
          else
            : >notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Rush $VERSION" \
            --notes-file notes.md \
            dist/*.tar.xz dist/SHA256SUMS

  aur:
    name: Publish rush-shell-bin to the AUR
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # Container steps default to sh.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package installs the tarballs this release just published, so it
      # takes their checksums from the release.
      - name: Update PKGBUILD
        run: |
          cd aur/rush-shell-bin
          curl -fsSL -o SHA256SUMS \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/SHA256SUMS"
          sum() { awk -v name="rush-$VERSION-$1-linux.tar.xz" '$2 == name { print $1 }' SHA256SUMS; }
          x86_64=$(sum x86_64)
          aarch64=$(sum aarch64)
          test -n "$x86_64" && test -n "$aarch64"
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=($x86_64)/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=($aarch64)/" \
            PKGBUILD
          rm SHA256SUMS
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' >.SRCINFO

      # Without the key, as in a fork, the release stops at GitHub.
      - name: Push to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >>~/.ssh/known_hosts
          # ssh looks in the passwd entry's home, /root, not the container's
          # $HOME, so it is told where both files are.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/rush-shell-bin.git "$RUNNER_TEMP/aur"
          cp aur/rush-shell-bin/{PKGBUILD,.SRCINFO,rush-shell.install} "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git config user.name "Tim Culverhouse"
          git config user.email "tim@timculverhouse.com"
          git add PKGBUILD .SRCINFO rush-shell.install
          git commit -m "Update to $VERSION"
          git push origin HEAD:master
