name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: zig fmt --check build.zig build.zig.zon src tests fuzz
          - name: Compile targets
            command: zig build compile-check
          - name: Unit tests
            command: zig build test
          - name: Conformance
            command: zig build conformance
          - name: Terminal
            command: zig build terminal
          # The host layer has macOS-specific paths (signals, posix_spawn,
          # job control, ptys) that Linux runs do not exercise.
          - name: macOS unit tests
            os: macos-latest
            command: zig build test
          - name: macOS conformance
            os: macos-latest
            command: zig build conformance
          - name: macOS terminal
            os: macos-latest
            command: zig build terminal

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.name }}

      # Zig 0.16.0 cannot fetch ZIP dependencies when a fresh cache lacks tmp/.
      - name: Prepare Zig package cache
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
